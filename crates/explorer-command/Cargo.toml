[package]
name = "vartacopy-explorer-command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "vartacopy_explorer"
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", default-features = false, features = ["std", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Shell"] }

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.62.2", default-features = false, features = ["Win32_UI_Shell_Common", "Win32_System_IO"] }

[lints]
workspace = true

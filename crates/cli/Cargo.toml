[package]
name = "vartacopy-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "vartacopy"
path = "src/main.rs"

[[bin]]
name = "vartacopy-fault"
path = "src/bin/fault.rs"
required-features = ["test-harness"]

[features]
test-harness = []

[dependencies]
vartacopy-shell-windows = { path = "../shell-windows" }
vartacopy-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[build-dependencies]
winresource = "=0.1.31"

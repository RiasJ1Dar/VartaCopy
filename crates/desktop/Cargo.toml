[package]
name = "vartacopy-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
# Windows filenames are case-insensitive; do not collide with the CLI vartacopy.exe.
name = "vartacopy-gui"
path = "src/main.rs"

[dependencies]
vartacopy-core = { path = "../core" }
vartacopy-shell-windows = { path = "../shell-windows" }
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "accesskit", "default_fonts"] }
rfd = { version = "=0.17.2", default-features = false }
serde_json.workspace = true
raw-window-handle = "0.6"
windows-sys = { workspace = true, features = ["Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_DataExchange"] }

[features]
test-harness = ["eframe/__screenshot"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[workspace]
members = ["crates/core", "crates/platform-windows", "crates/cli", "crates/desktop", "crates/shell-windows", "crates/explorer-command", "crates/explorer-drop-probe"]
resolver = "2"

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
blake3 = "1"
tempfile = "3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
